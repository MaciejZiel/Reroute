# Small-server deployment: web (nginx) + api + collector + Postgres, nothing but port 80 exposed.
#   docker compose -f docker-compose.prod.yml up -d --build
# Set POSTGRES_PASSWORD in .env. Import the timetable once:
#   docker compose -f docker-compose.prod.yml exec api python -m app.import_gtfs
name: reroute-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reroute}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reroute}
  GTFS_URL: ${GTFS_URL:-https://mkuran.pl/gtfs/warsaw.zip}
  GTFS_RT_URL: ${GTFS_RT_URL:-https://mkuran.pl/gtfs/warsaw/vehicles.pb}
  DATA_DIR: /app/data

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reroute}
      POSTGRES_USER: ${POSTGRES_USER:-reroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=2GB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reroute} -d ${POSTGRES_DB:-reroute}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ORIGINS: ""
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  collector:
    build: ./backend
    command: ["python", "-m", "app.collector", "run"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      GTFS_ALERTS_URL: ${GTFS_ALERTS_URL:-https://mkuran.pl/gtfs/warsaw/alerts.pb}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-20}
      OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:-7}
      ARRIVAL_RETENTION_DAYS: ${ARRIVAL_RETENTION_DAYS:-60}
      RAW_ARCHIVE_DIR: ${RAW_ARCHIVE_DIR:-}
      STORE_UNMATCHED: ${STORE_UNMATCHED:-true}
      SCHEDULE_REFRESH_HOURS: ${SCHEDULE_REFRESH_HOURS:-24}
      METRICS_PORT: 9100
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
