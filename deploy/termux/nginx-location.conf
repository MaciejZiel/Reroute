# Goes inside the server {} block of the Reroute host (static files are served separately).
# The API listens on 127.0.0.1:8081 (adjust to your port).

# Vehicle detail and predictions: one visitor polls them every 15 s, so 1 request/s is plenty.
location ~ ^/api/(vehicles/|predictions) {
    limit_req zone=reroute_heavy burst=5 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
}

location /api/ {
    limit_req zone=reroute_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
}
