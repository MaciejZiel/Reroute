# Goes inside the server {} block of the Reroute host (static files are served by the same block;
# the SPA fallback `location / { try_files $uri /index.html; }` stays in your server block).
# Needs nginx-http.conf included at http level. The API listens on 127.0.0.1:8081 (adjust).
# Replace /data/data/com.termux/files/home/reroute with the checkout path on the server.

limit_req_status 429;  # scoped to this server block on purpose (not in http {})

include /data/data/com.termux/files/home/reroute/deploy/termux/nginx-headers.conf;

# Endpoints that cost real work (history queries, predictions, an explanation): 1 request/s per
# visitor with a small burst. One visitor polls vehicle detail and predictions every 15 s.
location ~ ^/api/(vehicles/|predictions|punctuality|stops/[^/]+/departures) {
    limit_req zone=reroute_heavy burst=5 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
}

location /api/ {
    limit_req zone=reroute_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
}

# The page must never be served stale: after a rebuild it points at new hashed assets.
# (`/` and every SPA route reach this location through the index/try_files fallback.)
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /data/data/com.termux/files/home/reroute/deploy/termux/nginx-headers.conf;
}

# Vite output is content-hashed: it never changes in place.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";  # no "always": never cache a 404
    include /data/data/com.termux/files/home/reroute/deploy/termux/nginx-headers.conf;
    try_files $uri =404;
}

# Browser icons: cached for a day, and a missing file is a 404 instead of the SPA fallback page.
location ~ ^/(favicon\.(svg|ico)|favicon-[0-9x]+\.png|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=86400";
    include /data/data/com.termux/files/home/reroute/deploy/termux/nginx-headers.conf;
    try_files $uri =404;
}

# Not part of the app: a real 404 instead of index.html with status 200.
location = /robots.txt {
    try_files $uri =404;
}
location /.well-known/ {
    try_files $uri =404;
}
