# Goes in the http {} block (include it from nginx.conf). Limits what one visitor can cost.
# Visitors arrive through the tunnel, so the real address is in CF-Connecting-IP.
map $http_cf_connecting_ip $reroute_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $reroute_client zone=reroute_api:2m   rate=5r/s;
# Endpoints that read recent arrivals and may compute an explanation.
limit_req_zone $reroute_client zone=reroute_heavy:2m rate=1r/s;
limit_req_status 429;
