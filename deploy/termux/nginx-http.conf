# Goes in the http {} block (include it from nginx.conf). Limits what one visitor can cost.
# Visitors arrive through the tunnel, so the real address is in CF-Connecting-IP.
# Zones are shared by name only: nothing here changes the behaviour of other sites on this nginx.
# (limit_req_status is deliberately NOT set here, it lives in nginx-location.conf, inside the
# Reroute server block, so other sites keep their own status code.)
map $http_cf_connecting_ip $reroute_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $reroute_client zone=reroute_api:2m   rate=5r/s;
# Endpoints that read recent arrivals, compute predictions or aggregate history.
limit_req_zone $reroute_client zone=reroute_heavy:2m rate=1r/s;
