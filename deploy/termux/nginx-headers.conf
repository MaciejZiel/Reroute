# Security headers of the Reroute host. nginx drops inherited add_header lines in any location
# that has an add_header of its own, so nginx-location.conf includes this file again there.
# The CSP matches what the app loads: its own scripts and styles, Google Fonts (stylesheet and
# font files), OpenFreeMap vector tiles and glyphs, MapLibre's blob: web worker and data:/blob:
# images. Checked against the production build in Chromium: the map renders, no violations.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
