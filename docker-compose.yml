services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reroute}
      POSTGRES_USER: ${POSTGRES_USER:-reroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reroute} -d ${POSTGRES_DB:-reroute}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reroute:local-only-change-me@db:5432/reroute}
      GTFS_URL: ${GTFS_URL:-https://mkuran.pl/gtfs/warsaw.zip}
      GTFS_RT_URL: ${GTFS_RT_URL:-https://mkuran.pl/gtfs/warsaw/vehicles.pb}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
