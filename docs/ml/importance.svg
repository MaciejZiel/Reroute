</style><text class="t" x="16" y="24">What the model relies on</text><text x="242" y="58" text-anchor="end">stop delay, last 30 min (s)</text><rect x="250" y="46" width="278.3" height="16" rx="3" fill="var(--model)"/><text x="534.3" y="58">13.2</text><text x="242" y="84" text-anchor="end">stops ahead of the vehicle</text><rect x="250" y="72" width="268.4" height="16" rx="3" fill="var(--model)"/><text x="524.4" y="84">12.7</text><text x="242" y="110" text-anchor="end">delay of the vehicle ahead (s)</text><rect x="250" y="98" width="157.8" height="16" rx="3" fill="var(--model)"/><text x="413.8" y="110">7.5</text><text x="242" y="136" text-anchor="end">scheduled running time left (s)</text><rect x="250" y="124" width="157.7" height="16" rx="3" fill="var(--model)"/><text x="413.7" y="136">7.5</text><text x="242" y="162" text-anchor="end">delay reported by the vehicle now (s)</text><rect x="250" y="150" width="144.1" height="16" rx="3" fill="var(--model)"/><text x="400.1" y="162">6.8</text><text x="242" y="188" text-anchor="end">line delay, last 15 min (s)</text><rect x="250" y="176" width="132.0" height="16" rx="3" fill="var(--model)"/><text x="388.0" y="188">6.3</text><text x="242" y="214" text-anchor="end">delay change since the last stop (s)</text><rect x="250" y="202" width="83.3" height="16" rx="3" fill="var(--model)"/><text x="339.3" y="214">4.0</text><text x="242" y="240" text-anchor="end">delay trend (s per min)</text><rect x="250" y="228" width="62.3" height="16" rx="3" fill="var(--model)"/><text x="318.3" y="240">3.0</text><text x="242" y="266" text-anchor="end">time since the last recorded stop (s)</text><rect x="250" y="254" width="59.8" height="16" rx="3" fill="var(--model)"/><text x="315.8" y="266">2.8</text><text x="242" y="292" text-anchor="end">delay change at the last stop (s)</text><rect x="250" y="280" width="43.3" height="16" rx="3" fill="var(--model)"/><text x="299.3" y="292">2.1</text><text class="m" x="16" y="326">mean absolute SHAP value, second