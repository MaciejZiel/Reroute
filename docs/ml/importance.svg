<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" role="img" aria-label="What the model relies on"><style>
svg{--ink:#1d2824;--muted:#5b6a64;--grid:#dfe6e2;--base:#7d8b85;--model:#0e8f68;--accent:#d9622e}
@media (prefers-color-scheme: dark){svg{--ink:#e8eee9;--muted:#9eaba4;--grid:#2c3a35;--base:#9eaba4;--model:#6fd9b6;--accent:#ff8d74}}
text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.m{fill:var(--muted)}.t{font-size:14px;font-weight:600}.g{stroke:var(--grid);stroke-width:1}
</style><text class="t" x="16" y="24">What the model relies on</text><text x="242" y="58" text-anchor="end">stops ahead of the vehicle</text><rect x="250" y="46" width="278.3" height="16" rx="3" fill="var(--model)"/><text x="534.3" y="58">14.5</text><text x="242" y="84" text-anchor="end">stop delay, last 30 min (s)</text><rect x="250" y="72" width="242.4" height="16" rx="3" fill="var(--model)"/><text x="498.4" y="84">12.6</text><text x="242" y="110" text-anchor="end">scheduled running time left (s)</text><rect x="250" y="98" width="155.4" height="16" rx="3" fill="var(--model)"/><text x="411.4" y="110">8.1</text><text x="242" y="136" text-anchor="end">delay of the vehicle ahead (s)</text><rect x="250" y="124" width="145.6" height="16" rx="3" fill="var(--model)"/><text x="401.6" y="136">7.6</text><text x="242" y="162" text-anchor="end">delay reported by the vehicle now (s)</text><rect x="250" y="150" width="142.3" height="16" rx="3" fill="var(--model)"/><text x="398.3" y="162">7.4</text><text x="242" y="188" text-anchor="end">line delay, last 15 min (s)</text><rect x="250" y="176" width="102.2" height="16" rx="3" fill="var(--model)"/><text x="358.2" y="188">5.3</text><text x="242" y="214" text-anchor="end">delay change since the last stop (s)</text><rect x="250" y="202" width="68.1" height="16" rx="3" fill="var(--model)"/><text x="324.1" y="214">3.5</text><text x="242" y="240" text-anchor="end">delay change at the last stop (s)</text><rect x="250" y="228" width="54.0" height="16" rx="3" fill="var(--model)"/><text x="310.0" y="240">2.8</text><text x="242" y="266" text-anchor="end">delay trend (s per min)</text><rect x="250" y="254" width="47.6" height="16" rx="3" fill="var(--model)"/><text x="303.6" y="266">2.5</text><text x="242" y="292" text-anchor="end">is a tram</text><rect x="250" y="280" width="33.3" height="16" rx="3" fill="var(--model)"/><text x="289.3" y="292">1.7</text><text class="m" x="16" y="326">mean absolute SHAP value, seconds of delay change (test fold)</text></svg>
