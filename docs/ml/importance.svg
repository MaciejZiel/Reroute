<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" role="img" aria-label="What the model relies on"><style>
svg{--ink:#1d2824;--muted:#5b6a64;--grid:#dfe6e2;--base:#7d8b85;--model:#0e8f68;--accent:#d9622e}
@media (prefers-color-scheme: dark){svg{--ink:#e8eee9;--muted:#9eaba4;--grid:#2c3a35;--base:#9eaba4;--model:#6fd9b6;--accent:#ff8d74}}
text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.m{fill:var(--muted)}.t{font-size:14px;font-weight:600}.g{stroke:var(--grid);stroke-width:1}
</style><text class="t" x="16" y="24">What the model relies on</text><text x="242" y="58" text-anchor="end">stops ahead of the vehicle</text><rect x="250" y="46" width="278.3" height="16" rx="3" fill="var(--model)"/><text x="534.3" y="58">16.7</text><text x="242" y="84" text-anchor="end">stop delay, last 30 min (s)</text><rect x="250" y="72" width="207.4" height="16" rx="3" fill="var(--model)"/><text x="463.4" y="84">12.4</text><text x="242" y="110" text-anchor="end">delay of the vehicle ahead (s)</text><rect x="250" y="98" width="156.4" height="16" rx="3" fill="var(--model)"/><text x="412.4" y="110">9.4</text><text x="242" y="136" text-anchor="end">scheduled running time left (s)</text><rect x="250" y="124" width="136.0" height="16" rx="3" fill="var(--model)"/><text x="392.0" y="136">8.1</text><text x="242" y="162" text-anchor="end">delay reported by the vehicle now (s)</text><rect x="250" y="150" width="112.1" height="16" rx="3" fill="var(--model)"/><text x="368.1" y="162">6.7</text><text x="242" y="188" text-anchor="end">line delay, last 15 min (s)</text><rect x="250" y="176" width="82.0" height="16" rx="3" fill="var(--model)"/><text x="338.0" y="188">4.9</text><text x="242" y="214" text-anchor="end">delay change since the last stop (s)</text><rect x="250" y="202" width="78.2" height="16" rx="3" fill="var(--model)"/><text x="334.2" y="214">4.7</text><text x="242" y="240" text-anchor="end">time since the last recorded stop (s)</text><rect x="250" y="228" width="77.3" height="16" rx="3" fill="var(--model)"/><text x="333.3" y="240">4.6</text><text x="242" y="266" text-anchor="end">delay trend (s per min)</text><rect x="250" y="254" width="53.6" height="16" rx="3" fill="var(--model)"/><text x="309.6" y="266">3.2</text><text x="242" y="292" text-anchor="end">delay at the last stop (s)</text><rect x="250" y="280" width="32.1" height="16" rx="3" fill="var(--model)"/><text x="288.1" y="292">1.9</text><text class="m" x="16" y="326">mean absolute SHAP value, seconds of delay change (test fold)</text></svg>
