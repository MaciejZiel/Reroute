[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reroute-api"
version = "0.1.0"
description = "Live Warsaw transit map API and delay data collector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "geoalchemy2>=0.17,<1.0",
  "shapely>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "gtfs-rt-kit[http]>=0.1.0,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0"]
# Training only (laptop or CI). The server evaluates exported models with no extra dependency.
ml = ["lightgbm==4.7.0", "numpy==2.5.3", "scipy==1.18.1"]

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"ml/svg.py" = ["E501"]  # SVG markup in f-strings

[tool.setuptools.package-data]
app = ["migrations/*.sql"]
